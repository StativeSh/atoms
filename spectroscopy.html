<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ChemVerse — Spectroscopy Simulator</title>
    <meta name="description" content="Interactive IR and UV-Vis spectroscopy simulator with functional group analysis.">
    <link rel="stylesheet" href="ui.css">
    <link rel="stylesheet" href="spectroscopy.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
</head>

<body>
    <div class="page-aura" aria-hidden="true"></div>
    <!-- ─── Navigation ─── -->
    <nav class="top-nav"></nav>

    <div class="spec-layout">
        <!-- Left Panel: Molecule Picker -->
        <aside class="spec-sidebar">
            <h2>Molecules</h2>
            <div class="molecule-list" id="molecule-list">
                <!-- Populated by JS -->
            </div>
            <div class="mode-toggle">
                <button class="mode-btn active" id="btn-ir" data-mode="ir">IR Spectrum</button>
                <button class="mode-btn" id="btn-uv" data-mode="uv">UV-Vis</button>
            </div>
            <div class="functional-groups" id="functional-groups">
                <h3>Functional Groups</h3>
                <div id="fg-list">
                    <!-- Populated by JS -->
                </div>
            </div>
        </aside>

        <!-- Center: Spectrum Canvas -->
        <main class="spec-viewport">
            <div class="spec-header">
                <h1 id="spec-title">Select a molecule</h1>
                <span class="spec-formula" id="spec-formula"></span>
            </div>
            <div class="canvas-wrapper">
                <canvas id="spectrum-canvas" width="900" height="400"></canvas>
            </div>
            <div class="peak-info" id="peak-info">
                <p class="peak-hint">Click or hover over peaks for details</p>
            </div>
        </main>

        <!-- Right Panel: Details -->
        <aside class="spec-info">
            <h2>Peak analysis</h2>
            <div class="peak-table" id="peak-table">
                <!-- Populated by JS -->
            </div>
            <div class="spec-legend">
                <h3>Legend</h3>
                <div class="legend-item"><span class="legend-dot" style="background:var(--data-red)"></span> Strong</div>
                <div class="legend-item"><span class="legend-dot" style="background:var(--data-amber)"></span> Medium</div>
                <div class="legend-item"><span class="legend-dot" style="background:var(--data-green)"></span> Weak</div>
                <div class="legend-item"><span class="legend-dot" style="background:var(--data-violet)"></span> Broad</div>
            </div>
        </aside>
    </div>

    <script src="shared.js"></script>
    <script src="spectroscopy.js"></script>
    <script src="nav.js"></script>
    <script src="export.js"></script>
</body>

</html>
