<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Periodic Table — ChemVerse</title>
    <meta name="description"
        content="Explore all 118 elements with properties and trends, then open any element to see its orbitals in 3D.">
    <link rel="stylesheet" href="ui.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    <style>
        .pt-main {
            width: min(1240px, 100% - 48px);
            margin: 20px auto 56px;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .pt-head {
            display: flex;
            flex-wrap: wrap;
            align-items: flex-end;
            justify-content: space-between;
            gap: 20px 32px;
            padding: 28px 8px 4px;
        }

        .pt-head h1 {
            font-size: clamp(36px, 5vw, 56px);
            font-weight: 700;
            line-height: 1.04;
            letter-spacing: -0.03em;
        }

        .pt-lede {
            margin-top: 10px;
            max-width: 34em;
            font-size: 19px;
            color: var(--muted);
        }

        .search-container {
            position: relative;
            display: block;
            width: min(100%, 360px);
        }

        .search-icon {
            position: absolute;
            left: 16px;
            top: 50%;
            width: 18px;
            height: 18px;
            transform: translateY(-50%);
            color: var(--muted);
            pointer-events: none;
        }

        .search-container .search-input {
            width: 100%;
            min-height: 50px;
            padding: 0 20px 0 44px;
            border-radius: 980px;
            font-size: 16px;
        }

        .category-legend {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
        }

        .legend-item {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            min-height: 44px;
            padding: 0 16px;
            border: 1px solid var(--card-edge);
            border-radius: 980px;
            background: var(--card);
            color: var(--ink) !important;
            font-size: 14px;
            font-weight: 500;
            cursor: pointer;
            user-select: none;
        }

        .legend-item:hover {
            background: var(--chip);
        }

        .legend-item.active {
            background: var(--accent-soft);
            border-color: rgba(47, 91, 234, 0.4);
            color: var(--accent) !important;
        }

        .legend-dot {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            flex: none;
        }

        /* Table stage */
        .table-stage {
            padding: clamp(14px, 2.4vw, 28px);
        }

        .table-container {
            overflow-x: auto;
        }

        .periodic-grid {
            display: grid;
            grid-template-columns: repeat(18, minmax(0, 1fr));
            gap: 4px;
            min-width: 860px;
        }

        .la-ac-separator {
            grid-column: 1 / -1;
            height: 14px;
        }

        .la-ac-label {
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 11px;
            font-weight: 600;
            letter-spacing: 0.08em;
            text-transform: uppercase;
            text-align: center;
            color: var(--muted);
        }

        .element-tile {
            position: relative;
            aspect-ratio: 1;
            min-width: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 0;
            padding: 11px 2px 2px;
            border-radius: 12px;
            border: 1px solid color-mix(in srgb, var(--tile-color) 28%, #fff);
            background: color-mix(in srgb, var(--tile-color) 11%, #fff);
            color: var(--ink);
            text-decoration: none;
            cursor: pointer;
            overflow: hidden;
        }

        .element-tile:hover {
            background: color-mix(in srgb, var(--tile-color) 22%, #fff);
            border-color: var(--tile-color);
            z-index: 2;
        }

        .element-tile.dimmed {
            opacity: 0.22;
        }

        .element-tile.dimmed:hover {
            opacity: 0.6;
        }

        .tile-z {
            position: absolute;
            top: 4px;
            left: 6px;
            font: 500 9px var(--font-mono);
            color: var(--muted-strong);
        }

        .tile-symbol {
            font: 700 clamp(14px, 1.55vw, 22px)/1 var(--font-display);
            letter-spacing: -0.02em;
            color: color-mix(in srgb, var(--tile-color) 58%, #1D1D1F);
        }

        .tile-name {
            max-width: 100%;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
            font-size: clamp(8px, 0.8vw, 11px);
            line-height: 1.15;
            color: var(--muted-strong);
        }

        .tile-mass {
            font: 400 clamp(8px, 0.75vw, 10px)/1.1 var(--font-mono);
            color: var(--muted);
        }

        /* Hover detail card */
        .hover-card {
            position: fixed;
            z-index: 500;
            width: 230px;
            padding: 18px 20px;
            border-radius: 22px;
            pointer-events: none;
            opacity: 0;
            visibility: hidden;
        }

        .hover-card.visible {
            opacity: 1;
            visibility: visible;
        }

        .hc-symbol {
            font: 700 40px/1 var(--font-display);
            letter-spacing: -0.03em;
        }

        .hc-name {
            margin-top: 2px;
            font: 600 18px var(--font-display);
            color: var(--night-text);
        }

        .hc-details {
            margin: 10px 0;
            font-size: 14px;
            line-height: 1.6;
            color: var(--night-muted);
        }

        .hc-details strong {
            color: var(--night-text);
            font-weight: 600;
        }

        .hc-badge {
            display: inline-block;
            padding: 3px 12px;
            border-radius: 980px;
            font-size: 12px;
            font-weight: 600;
            background: rgba(255, 255, 255, 0.92) !important;
        }

        .hc-cta {
            display: block;
            margin-top: 12px;
            font-size: 13px;
            color: var(--night-accent);
        }

        .stats-bar {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: 12px;
        }

        .stat-item {
            padding: 16px 20px;
            border-radius: 20px;
            background: var(--card);
            border: 1px solid var(--card-edge);
        }

        .stat-value {
            font: 600 32px/1.1 var(--font-display);
            font-variant-numeric: tabular-nums;
        }

        .stat-label {
            margin-top: 2px;
            font-size: 14px;
            color: var(--muted);
        }

        @media (max-width: 900px) {
            .periodic-grid {
                gap: 3px;
                min-width: 760px;
            }

            .la-ac-label {
                font-size: 9px;
                letter-spacing: 0.02em;
            }

            .tile-name {
                display: none;
            }
        }
    </style>
</head>

<body>
    <div class="page-aura" aria-hidden="true"></div>
    <nav class="top-nav"></nav>

    <main class="pt-main">
        <header class="pt-head">
            <div>
                <h1>Periodic Table</h1>
                <p class="pt-lede">Explore the elements, then open any one to see its orbitals in 3D.</p>
            </div>
            <label class="search-container">
                <span class="sr-only">Search elements</span>
                <svg class="search-icon" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.8"
                    stroke-linecap="round" aria-hidden="true">
                    <circle cx="7" cy="7" r="4.5" />
                    <path d="M10.5 10.5 14 14" />
                </svg>
                <input type="search" id="element-search" class="search-input"
                    placeholder="Search by name, symbol or number">
            </label>
        </header>

        <div class="category-legend" id="category-legend" role="group" aria-label="Filter by category">
            <!-- Populated by JS -->
        </div>

        <section class="table-stage stage" aria-label="Periodic table of the elements">
            <div class="table-container">
                <div class="periodic-grid" id="periodic-grid">
                    <!-- Populated by JS -->
                </div>
            </div>
        </section>

        <div class="stats-bar">
            <div class="stat-item">
                <div class="stat-value">118</div>
                <div class="stat-label">Elements</div>
            </div>
            <div class="stat-item">
                <div class="stat-value">118</div>
                <div class="stat-label">Viewable in 3D</div>
            </div>
            <div class="stat-item">
                <div class="stat-value">12</div>
                <div class="stat-label">Preset molecules</div>
            </div>
        </div>
    </main>

    <!-- Hover detail card -->
    <div id="hover-card" class="hover-card glass-dark" aria-hidden="true">
        <div class="hc-symbol" id="hc-symbol">C</div>
        <div class="hc-name" id="hc-name">Carbon</div>
        <div class="hc-details" id="hc-details"></div>
        <span class="hc-badge" id="hc-badge">Nonmetal</span>
        <span class="hc-cta" id="hc-cta">Open in 3D</span>
    </div>

    <script src="shared.js"></script>
    <script src="periodic-table.js"></script>
    <script src="nav.js"></script>
</body>

</html>
