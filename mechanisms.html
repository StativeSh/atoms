<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ChemVerse — Reaction Mechanism Animator</title>
    <meta name="description"
        content="Step-by-step arrow-pushing animations for SN1, SN2, E1, E2 and other organic reaction mechanisms.">
    <link rel="stylesheet" href="ui.css">
    <link rel="stylesheet" href="mechanisms.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
</head>

<body>
    <div class="page-aura" aria-hidden="true"></div>
    <nav class="top-nav"></nav>

    <div class="mech-layout">
        <!-- Left: Mechanism Picker -->
        <aside class="mech-sidebar">
            <h2>Mechanisms</h2>
            <div class="mech-list" id="mech-list">
                <!-- Populated by JS -->
            </div>
        </aside>

        <!-- Center: Animation Canvas -->
        <main class="mech-viewport">
            <div class="mech-header">
                <h1 id="mech-title">Select a mechanism</h1>
                <span class="mech-type" id="mech-type"></span>
            </div>
            <div class="canvas-container">
                <canvas id="mech-canvas" width="900" height="450"></canvas>
            </div>
            <div class="playback-controls">
                <button class="ctrl-btn" id="btn-prev" title="Previous step" aria-label="Previous step"><svg viewBox="0 0 16 16" fill="currentColor" aria-hidden="true"><path d="M3 3h2v10H3zM13 3v10L6 8z"/></svg></button>
                <button class="ctrl-btn play-btn" id="btn-play" title="Play or pause" aria-label="Play or pause"><svg viewBox="0 0 16 16" fill="currentColor" aria-hidden="true"><path d="M5 3v10l8-5z"/></svg></button>
                <button class="ctrl-btn" id="btn-next" title="Next step" aria-label="Next step"><svg viewBox="0 0 16 16" fill="currentColor" aria-hidden="true"><path d="M11 3h2v10h-2zM3 3v10l7-5z"/></svg></button>
                <div class="step-indicator">
                    <span id="step-current">0</span> / <span id="step-total">0</span>
                </div>
                <input type="range" id="speed-slider" min="0.25" max="3" value="1" step="0.25" class="speed-slider">
                <span class="speed-label" id="speed-label">1×</span>
            </div>
        </main>

        <!-- Right: Step Details -->
        <aside class="mech-info">
            <h2>Step details</h2>
            <div class="step-card" id="step-card">
                <div class="step-name" id="step-name">—</div>
                <div class="step-desc" id="step-desc">Select a mechanism to begin</div>
            </div>
            <div class="mech-notes">
                <h3>Key concepts</h3>
                <div id="mech-concepts">
                    <!-- Populated by JS -->
                </div>
            </div>
            <div class="mech-summary">
                <h3>Summary</h3>
                <div id="mech-summary-text">—</div>
            </div>
        </aside>
    </div>

    <script src="explain.js"></script>
    <script src="mechanisms.js"></script>
    <script src="nav.js"></script>
    <script src="export.js"></script>
</body>

</html>
